<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติการสนทนา - TATIP AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <header class="top-navbar">
        <div class="nav-container">
            <a href="index.html" class="brand-logo">
                <div class="logo-box"><i class="fa-solid fa-robot"></i> <span class="logo-text">TATIP AI</span></div>
            </a>
            <button onclick="clearAllHistory()" style="background:none; border:none; color:#DC2626; cursor:pointer; font-size:0.8rem; font-weight:600;"><i class="fa-solid fa-trash-can"></i> ล้างสำเนาในเครื่อง</button>
        </div>
    </header>

    <main class="main-content">
        <div class="page-title-box">
            <h2><i class="fa-solid fa-clock-rotate-left text-red"></i> ประวัติการสนทนา</h2>
        </div>

        <div class="history-controls-bar">
            <div class="search-box-wrapper">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="historySearch" placeholder="ค้นหาประวัติ..." onkeyup="filterHistory()">
            </div>
        </div>

        <div id="historyList" class="history-grid-container"></div>
    </main>

    <!-- BOTTOM NAVIGATION BAR -->
    <nav class="bottom-nav">
        <a href="index.html" class="bottom-nav-item">
            <i class="fa-solid fa-house"></i>
            <span>หน้าหลัก</span>
        </a>
        <a href="chat.html" class="bottom-nav-item">
            <i class="fa-solid fa-comments"></i>
            <span>แชท AI</span>
        </a>
        <a href="history.html" class="bottom-nav-item active">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <span>ประวัติ</span>
        </a>
        <a href="faq.html" class="bottom-nav-item">
            <i class="fa-solid fa-circle-question"></i>
            <span>คำถาม</span>
        </a>
        <a href="contact.html" class="bottom-nav-item">
            <i class="fa-solid fa-headset"></i>
            <span>ติดต่อ</span>
        </a>
    </nav>

    <div id="transcriptModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fa-solid fa-file-lines text-red"></i> รายละเอียดประวัติ</h3>
                <button class="btn-close-modal" onclick="closeTranscriptModal()">&times;</button>
            </div>
            <div id="transcriptBody"><p>กำลังโหลด...</p></div>
        </div>
    </div>
    <script>
    function clearAllHistory() {
        // ดึงชื่อ User ปัจจุบัน
        const currentUserStr = localStorage.getItem('currentUser');
        let username = 'guest';
        if (currentUserStr) {
            try { username = JSON.parse(currentUserStr).username || 'guest'; } catch (e) {}
        }
        
        if (confirm(`ล้างสำเนาประวัติในเบราว์เซอร์ของบัญชี [ ${username} ] ใช่หรือไม่? ข้อมูลที่บันทึกใน Firestore จะไม่ถูกลบ`)) {
            localStorage.removeItem(`tatip_chat_history_${username}`);
            loadHistory(); // โหลดประวัติจาก Firestore อีกครั้ง
        }
    }
</script>

    <script src="./script.js"></script>
</body>
</html>
