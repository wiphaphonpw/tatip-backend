<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ติดต่อเจ้าหน้าที่ - TATIP AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./styles.css?v=20261030-logo1">
</head>
<body>
    <header class="top-navbar">
        <div class="nav-container">
            <a href="index.html" class="brand-logo">
                <div class="logo-box"><span class="logo-mark" aria-hidden="true"><img src="./assets/tatip-logo-source.png" alt=""></span> <span class="logo-text">TATIP AI</span></div>
            </a>
        </div>
    </header>

    <main class="main-content">
        <div class="page-title-box">
            <h2><i class="fa-solid fa-headset text-red"></i> ติดต่อเจ้าหน้าที่</h2>
        </div>

        <div class="contact-grid-layout">
            <div class="contact-channels">
                <div class="channel-card">
                    <div class="channel-icon red"><i class="fa-solid fa-ticket"></i></div>
                    <div class="channel-info">
                        <h4>Ticket ซัพพอร์ต 24 ชม.</h4>
                        <button onclick="openSupportModal()" style="background:var(--primary-red); color:white; border:none; padding:0.3rem 0.6rem; border-radius:4px; font-size:0.75rem; margin-top:0.3rem;">เปิด Ticket</button>
                    </div>
                </div>
                <div class="channel-card">
                    <div class="channel-icon blue"><i class="fa-solid fa-phone"></i></div>
                    <div class="channel-info">
                        <h4>Call Center</h4>
                        <div class="phone-num">02-123-4567</div>
                    </div>
                </div>
            </div>

            <div class="contact-form-card">
                <h3><i class="fa-solid fa-paper-plane text-red"></i> ฝากข้อความ</h3>
                <form onsubmit="handleDirectContactSubmit(event)">
                    <div class="form-group"><label>ชื่อ-นามสกุล <span class="req">*</span></label><input type="text" required></div>
                    <div class="form-group"><label>เบอร์โทรศัพท์ <span class="req">*</span></label><input type="tel" required></div>
                    <div class="form-group"><label>รายละเอียดปัญหา <span class="req">*</span></label><textarea rows="3" required></textarea></div>
                    <button type="submit" class="btn-send-contact-form">ส่งข้อความ</button>
                </form>
            </div>
        </div>
    </main>

    <!-- BOTTOM NAVIGATION BAR -->
    <nav class="bottom-nav">
        <a href="index.html" class="bottom-nav-item">
            <i class="fa-solid fa-house"></i>
            <span>หน้าหลัก</span>
        </a>
        <a href="chat.html" class="bottom-nav-item">
            <i class="fa-solid fa-comments"></i>
            <span>แชท AI</span>
        </a>
        <a href="history.html" class="bottom-nav-item">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <span>ประวัติ</span>
        </a>
        <a href="faq.html" class="bottom-nav-item">
            <i class="fa-solid fa-circle-question"></i>
            <span>คำถาม</span>
        </a>
        <a href="contact.html" class="bottom-nav-item active">
            <i class="fa-solid fa-headset"></i>
            <span>ติดต่อ</span>
        </a>
    </nav>

    <div id="ticketModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fa-solid fa-ticket text-red"></i> เปิด Ticket</h3>
                <button class="btn-close-modal" onclick="closeSupportModal()">&times;</button>
            </div>
            <form onsubmit="submitSupportTicket(event)">
                <div class="form-group"><label>รายละเอียดปัญหา <span class="req">*</span></label><textarea rows="3" required></textarea></div>
                <div style="display:flex; justify-content:flex-end; gap:0.4rem;">
                    <button type="button" onclick="closeSupportModal()" style="border:none; background:#F1F5F9; padding:0.4rem 0.8rem; border-radius:4px;">ยกเลิก</button>
                    <button type="submit" style="background:#C81E1E; color:white; border:none; padding:0.4rem 0.8rem; border-radius:4px;">ส่งเรื่อง</button>
                </div>
            </form>
        </div>
    </div>

    <script src="./script.js"></script>
    <script src="./script.js"></script>
<script>
    // ตั้งค่า API_URL ให้ตรงกับ Cloud Run ของคุณ
    const BACKEND_URL = typeof API_URL !== 'undefined' ? API_URL : 'https://tatip-backend-417035159214.us-central1.run.app';

    // ฟังก์ชันจัดการเมื่อส่งฟอร์ม "ฝากข้อความ"
    async function handleDirectContactSubmit(event) {
        event.preventDefault();
        const inputs = event.target.querySelectorAll('input, textarea');
        const name = inputs[0].value.trim();
        const phone = inputs[1].value.trim();
        const issue = inputs[2].value.trim();

        const caseId = "CASE-" + Date.now().toString().slice(-6);

        const payload = {
            case_id: caseId,
            user_id: name,
            tenant_id: "tenant_general",
            branch: phone, // เก็บเบอร์โทรศัพท์ไว้ในฟิลด์ branch
            camera_name: "N/A",
            issue: issue,
            priority: "P2"
        };

        try {
            const response = await fetch(`${BACKEND_URL}/api/admin/create-case`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const result = await response.json();

            if (response.ok && result.status === 'success') {
                alert('✅ ส่งข้อความเรียบร้อยแล้ว! รหัสแจ้งเรื่องของคุณคือ: ' + caseId);
                event.target.reset();
            } else {
                alert('❌ เกิดข้อผิดพลาด: ' + (result.detail || 'ไม่สามารถส่งข้อความได้'));
            }
        } catch (error) {
            console.error('Error:', error);
            alert('❌ ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้');
        }
    }

    // ฟังก์ชันเปิด/ปิด Modal และส่ง Ticket
    function openSupportModal() {
        document.getElementById('ticketModal').classList.add('active');
    }

    function closeSupportModal() {
        document.getElementById('ticketModal').classList.remove('active');
    }

    async function submitSupportTicket(event) {
        event.preventDefault();
        const issue = event.target.querySelector('textarea').value.trim();
        const caseId = "TICKET-" + Date.now().toString().slice(-6);

        // ดึงข้อมูลผู้ใช้ที่ล็อกอินอยู่ (ถ้ามี)
        const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');

        const payload = {
            case_id: caseId,
            user_id: currentUser.username || "Guest User",
            tenant_id: currentUser.tenant_id || "DEFAULT",
            branch: "Online Support",
            camera_name: "CCTV-Support",
            issue: issue,
            priority: "P1"
        };

        try {
            const response = await fetch(`${BACKEND_URL}/api/admin/create-case`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const result = await response.json();

            if (response.ok && result.status === 'success') {
                alert('✅ เปิด Ticket เรียบร้อยแล้ว! รหัส Ticket: ' + caseId);
                closeSupportModal();
                event.target.reset();
            } else {
                alert('❌ เกิดข้อผิดพลาดในการเปิด Ticket');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('❌ ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้');
        }
    }
</script>
</body>
</html>
