<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ติดต่อเจ้าหน้าที่ - TATIP AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./styles.css?v=20261102-mobile1">
</head>
<body>
    <header class="top-navbar">
        <div class="nav-container">
            <a href="index.html" class="brand-logo">
                <div class="logo-box"><span class="logo-mark" aria-hidden="true"><img src="./assets/tatip-logo-source.png" alt=""></span> <span class="logo-text">TATIP AI</span></div>
            </a>
        </div>
    </header>

    <main class="main-content">
        <div class="page-title-box">
            <h2><i class="fa-solid fa-headset text-red"></i> ติดต่อเจ้าหน้าที่</h2>
        </div>

        <div class="contact-grid-layout">
            <div class="contact-channels">
                <div class="channel-card">
                    <div class="channel-icon red"><i class="fa-solid fa-ticket"></i></div>
                    <div class="channel-info">
                        <h4>Ticket ซัพพอร์ต 24 ชม.</h4>
                        <button onclick="openSupportModal()" style="background:var(--primary-red); color:white; border:none; padding:0.3rem 0.6rem; border-radius:4px; font-size:0.75rem; margin-top:0.3rem;">เปิด Ticket</button>
                    </div>
                </div>
                <div class="channel-card">
                    <div class="channel-icon blue"><i class="fa-solid fa-phone"></i></div>
                    <div class="channel-info">
                        <h4>ฝ่ายบริการลูกค้า</h4>
                        <div class="phone-num">094-965-9976</div>
                    </div>
                </div>
            </div>

            <div class="contact-form-card">
                <h3><i class="fa-solid fa-paper-plane text-red"></i> ฝากข้อความ</h3>
                <form id="directContactForm" onsubmit="handleDirectContactSubmit(event)">
                    <div class="form-group">
                        <label for="contactName">ชื่อ-นามสกุล <span class="req">*</span></label>
                        <input id="contactName" name="full_name" type="text" maxlength="120" autocomplete="name" required>
                    </div>
                    <div class="form-group">
                        <label for="contactPhone">เบอร์โทรศัพท์ <span class="req">*</span></label>
                        <input id="contactPhone" name="phone" type="tel" maxlength="30" autocomplete="tel" required>
                    </div>
                    <div class="form-group">
                        <label for="contactIssue">รายละเอียดปัญหา <span class="req">*</span></label>
                        <textarea id="contactIssue" name="issue" rows="3" maxlength="3000" required></textarea>
                    </div>
                    <div aria-hidden="true" style="position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden;">
                        <label for="contactWebsite">เว็บไซต์</label>
                        <input id="contactWebsite" name="website" type="text" tabindex="-1" autocomplete="off">
                    </div>
                    <p id="contactFormStatus" role="status" aria-live="polite"></p>
                    <button type="submit" class="btn-send-contact-form">ส่งข้อความ</button>
                </form>
            </div>
        </div>
    </main>

    <!-- BOTTOM NAVIGATION BAR -->
    <nav class="bottom-nav">
        <a href="index.html" class="bottom-nav-item">
            <i class="fa-solid fa-house"></i>
            <span>หน้าหลัก</span>
        </a>
        <a href="chat.html" class="bottom-nav-item">
            <i class="fa-solid fa-comments"></i>
            <span>แชท AI</span>
        </a>
        <a href="history.html" class="bottom-nav-item">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <span>ประวัติ</span>
        </a>
        <a href="faq.html" class="bottom-nav-item">
            <i class="fa-solid fa-circle-question"></i>
            <span>คำถาม</span>
        </a>
        <a href="contact.html" class="bottom-nav-item active">
            <i class="fa-solid fa-headset"></i>
            <span>ติดต่อ</span>
        </a>
    </nav>

    <div id="ticketModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fa-solid fa-ticket text-red"></i> เปิด Ticket</h3>
                <button class="btn-close-modal" onclick="closeSupportModal()">&times;</button>
            </div>
            <form onsubmit="submitSupportTicket(event)">
                <div class="form-group">
                    <label for="ticketName">ชื่อ-นามสกุล <span class="req">*</span></label>
                    <input id="ticketName" name="full_name" type="text" maxlength="120" autocomplete="name" required>
                </div>
                <div class="form-group">
                    <label for="ticketPhone">เบอร์โทรศัพท์ <span class="req">*</span></label>
                    <input id="ticketPhone" name="phone" type="tel" maxlength="30" autocomplete="tel" required>
                </div>
                <div class="form-group">
                    <label for="ticketIssue">รายละเอียดปัญหา <span class="req">*</span></label>
                    <textarea id="ticketIssue" name="issue" rows="3" maxlength="3000" required></textarea>
                </div>
                <div aria-hidden="true" style="position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden;">
                    <label for="ticketWebsite">เว็บไซต์</label>
                    <input id="ticketWebsite" name="website" type="text" tabindex="-1" autocomplete="off">
                </div>
                <p id="ticketFormStatus" role="status" aria-live="polite"></p>
                <div style="display:flex; justify-content:flex-end; gap:0.4rem;">
                    <button type="button" onclick="closeSupportModal()" style="border:none; background:#F1F5F9; padding:0.4rem 0.8rem; border-radius:4px;">ปิด</button>
                    <button type="submit" style="background:#C81E1E; color:white; border:none; padding:0.4rem 0.8rem; border-radius:4px;">ส่งเรื่อง</button>
                </div>
            </form>
        </div>
    </div>

    <script src="./script.js?v=20261105-publiccontact1"></script>
    <script>
        const CONTACT_API_URL = typeof API_URL !== 'undefined'
            ? API_URL
            : 'https://tatip-backend-417035159214.us-central1.run.app';

        async function sendPublicContactCase(form, statusElement, submitButton) {
            const values = Object.fromEntries(new FormData(form).entries());
            statusElement.textContent = 'กำลังส่งข้อความ...';
            statusElement.style.color = '#64748b';
            submitButton.disabled = true;

            try {
                const response = await fetch(`${CONTACT_API_URL}/api/contact-cases`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(values)
                });
                const result = await response.json().catch(() => ({}));
                if (!response.ok || result.status !== 'success') {
                    throw new Error(result.detail || 'ไม่สามารถส่งข้อความได้ กรุณาลองใหม่');
                }

                statusElement.textContent = result.case_id
                    ? `ส่งข้อความแล้ว เจ้าหน้าที่จะติดต่อกลับ รหัสเคส: ${result.case_id}`
                    : result.message || 'ส่งข้อความให้เจ้าหน้าที่แล้ว';
                statusElement.style.color = '#15803d';
                form.reset();
            } catch (error) {
                statusElement.textContent = error.message || 'เชื่อมต่อระบบไม่สำเร็จ กรุณาลองใหม่';
                statusElement.style.color = '#dc2626';
            } finally {
                submitButton.disabled = false;
            }
        }

        function handleDirectContactSubmit(event) {
            event.preventDefault();
            const form = event.currentTarget;
            sendPublicContactCase(form, document.getElementById('contactFormStatus'), form.querySelector('[type="submit"]'));
        }

        function openSupportModal() {
            document.getElementById('ticketModal').classList.add('active');
        }

        function closeSupportModal() {
            document.getElementById('ticketModal').classList.remove('active');
        }

        function submitSupportTicket(event) {
            event.preventDefault();
            const form = event.currentTarget;
            sendPublicContactCase(form, document.getElementById('ticketFormStatus'), form.querySelector('[type="submit"]'));
        }
    </script>
</body>
</html>
