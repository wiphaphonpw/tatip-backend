name: Validate TATIP AI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-check:
    name: Check Python and frontend syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check backend Python syntax
        run: python -m py_compile main.py

      - name: Check frontend JavaScript syntax
        run: node --check script.js

      - name: Check inline JavaScript in HTML pages
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          import tempfile

          class InlineScripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.external = False
                  self.parts = []
                  self.scripts = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.in_script = True
                      self.external = any(name.lower() == "src" for name, _ in attrs)
                      self.parts = []

              def handle_data(self, data):
                  if self.in_script and not self.external:
                      self.parts.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.in_script:
                      if not self.external and "".join(self.parts).strip():
                          self.scripts.append("".join(self.parts))
                      self.in_script = False
                      self.external = False
                      self.parts = []

          for page in Path(".").glob("*.html"):
              parser = InlineScripts()
              parser.feed(page.read_text(encoding="utf-8"))
              for script in parser.scripts:
                  with tempfile.NamedTemporaryFile(
                      mode="w", suffix=".js", encoding="utf-8", delete=False
                  ) as temp:
                      temp.write(script)
                      temp_path = temp.name
                  subprocess.run(["node", "--check", temp_path], check=True)
          PY

